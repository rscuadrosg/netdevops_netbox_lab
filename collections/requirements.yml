---
# Ansible collections this project depends on.
# Install with:
#   ansible-galaxy collection install -r collections/requirements.yml
collections:
  - name: netbox.netbox        # NetBox modules and dynamic inventory plugin
    version: ">=3.23.0"
  - name: nokia.srlinux        # Modules for SR Linux (JSON-RPC)
    version: ">=1.1.1"
  - name: ansible.netcommon    # httpapi connection used by network platforms
    version: ">=8.6.2"
