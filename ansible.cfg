# Ansible settings for this project. Picked up automatically when Ansible
# runs from the repo root.

[defaults]
# Dynamic inventory from NetBox 
inventory = inventory/netbox.yml
# Lab routers get new SSH host keys on every redeploy, so don't prompt for them
host_key_checking = False
# Don't litter the repo with .retry files after a failed run
retry_files_enabled = False
# Pick the Python interpreter without printing a warning
interpreter_python = auto_silent
# Human-readable task output
callback_result_format = yaml
