---
# Connection settings for every SR Linux device (NetBox platform "srlinux").
# The nokia.srlinux collection talks JSON-RPC over HTTPS, not SSH/CLI.

ansible_connection: ansible.netcommon.httpapi
ansible_network_os: nokia.srlinux.srlinux
ansible_httpapi_use_ssl: true
# Lab routers use self-signed certificates
ansible_httpapi_validate_certs: false

ansible_user: admin
# Containerlab factory password; override it with the SRL_PASSWORD env var
ansible_password: >-
  {{ lookup('ansible.builtin.env', 'SRL_PASSWORD') | default('NokiaSrl1!', true) }}
