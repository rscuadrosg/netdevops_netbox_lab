---
# Lint every push and pull request: YAML style and Ansible best practices.
# Same checks as running "yamllint ." and "ansible-lint" locally.
name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: yamllint + ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
